<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210" />
      <stop offset="100%" stop-color="#0c201a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="aiPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="28" fill="url(#bgAi)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Glowing Pulse Sphere -->
  <circle cx="400" cy="220" r="160" fill="url(#aiPulse)" />

  <!-- Neural Mesh Wave -->
  <g fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6">
    <path d="M 150 250 C 250 150, 350 320, 450 200 C 550 80, 650 240, 700 220" />
    <path d="M 150 280 C 270 200, 370 300, 470 170 C 570 110, 630 270, 700 250" opacity="0.4"/>
    <path d="M 150 220 C 230 180, 330 250, 430 230 C 530 170, 610 210, 700 190" opacity="0.5"/>
  </g>

  <!-- Interactive AI Query Glass Card -->
  <rect x="220" y="140" width="360" height="180" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />
  
  <rect x="245" y="165" width="310" height="36" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="265" cy="183" r="5" fill="#10B981" />
  <text x="280" y="187" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="12">POST /v2/ai/inference/streaming</text>

  <rect x="245" y="215" width="220" height="12" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="245" y="235" width="280" height="12" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="245" y="255" width="160" height="12" rx="4" fill="rgba(255,255,255,0.1)" />

  <rect x="245" y="280" width="90" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1" />
  <text x="290" y="296" fill="#10B981" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">200 OK</text>

  <!-- Metrics -->
  <rect x="200" y="370" width="400" height="50" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="230" y="400" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12">Token Stream: <tspan fill="#10B981" font-weight="bold">185 t/s</tspan></text>
  <text x="430" y="400" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12">GPU Cluster: <tspan fill="#FFFFFF" font-weight="bold">H100 NVLink</tspan></text>
</svg>
