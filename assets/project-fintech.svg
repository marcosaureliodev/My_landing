<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFintech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a" />
      <stop offset="100%" stop-color="#19102c" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.05)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="28" fill="url(#bgFintech)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Apple Wallet style cards stack -->
  <g transform="translate(180, 70)">
    <!-- Back card -->
    <rect x="80" y="40" width="380" height="230" rx="22" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" transform="rotate(6, 270, 155)" />

    <!-- Middle card -->
    <rect x="50" y="50" width="380" height="230" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" transform="rotate(-3, 240, 165)" />

    <!-- Front glass card -->
    <rect x="20" y="70" width="400" height="240" rx="22" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    
    <!-- Chip & Logo -->
    <rect x="50" y="105" width="45" height="32" rx="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="370" cy="115" r="16" fill="rgba(255,255,255,0.15)" />
    <circle cx="385" cy="115" r="16" fill="rgba(255,255,255,0.1)" />

    <text x="50" y="195" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="12" letter-spacing="2">REALTIME SETTLEMENT ENGINE</text>
    <text x="50" y="240" fill="#FFFFFF" font-family="monospace" font-size="18" letter-spacing="4">•••• •••• •••• 9842</text>
    <text x="50" y="280" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">SECURITY LEVEL</text>
    <text x="50" y="295" fill="#A855F7" font-family="sans-serif" font-size="13" font-weight="700">PCI-DSS TIER 1</text>
  </g>

  <!-- Metric Glass Strip -->
  <rect x="150" y="380" width="500" height="60" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <g transform="translate(180, 395)">
    <text x="0" y="15" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Daily Processed</text>
    <text x="0" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">$42.8M+</text>

    <text x="160" y="15" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Uptime SLA</text>
    <text x="160" y="34" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">99.999%</text>

    <text x="310" y="15" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Fraud Detection</text>
    <text x="310" y="34" fill="#A855F7" font-family="sans-serif" font-size="16" font-weight="700">&lt; 15 ms</text>
  </g>
</svg>
