<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central Glass Card -->
  <rect x="120" y="80" width="560" height="340" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Window Header dots -->
  <circle cx="150" cy="110" r="6" fill="#FF5F56" />
  <circle cx="170" cy="110" r="6" fill="#FFBD2E" />
  <circle cx="190" cy="110" r="6" fill="#27C93F" />
  <text x="400" y="115" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="500">cluster-orchestrator.node.ts</text>

  <!-- Network Topology Nodes -->
  <g filter="url(#glow)">
    <line x1="220" y1="260" x2="380" y2="200" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <line x1="380" y1="200" x2="560" y2="230" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>
    <line x1="380" y1="200" x2="400" y2="340" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>
    <line x1="220" y1="260" x2="400" y2="340" stroke="#00F0FF" stroke-width="2" opacity="0.4"/>
    <line x1="560" y1="230" x2="400" y2="340" stroke="#00F0FF" stroke-width="2" opacity="0.5"/>

    <!-- Nodes -->
    <circle cx="220" cy="260" r="18" fill="#121829" stroke="#00F0FF" stroke-width="3" />
    <circle cx="220" cy="260" r="6" fill="#00F0FF" />

    <circle cx="380" cy="200" r="28" fill="#121829" stroke="url(#cyanGrad)" stroke-width="3.5" />
    <circle cx="380" cy="200" r="10" fill="#00F0FF" />

    <circle cx="560" cy="230" r="20" fill="#121829" stroke="#00F0FF" stroke-width="3" />
    <circle cx="560" cy="230" r="7" fill="#00F0FF" />

    <circle cx="400" cy="340" r="16" fill="#121829" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="400" cy="340" r="5" fill="#00F0FF" />
  </g>

  <!-- Metric Badges -->
  <rect x="150" y="340" width="130" height="42" rx="12" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)" stroke-width="1"/>
  <text x="165" y="358" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="10">Throughput</text>
  <text x="165" y="374" fill="#00F0FF" font-family="sans-serif" font-size="13" font-weight="700">1.4M req/s</text>

  <rect x="520" y="340" width="130" height="42" rx="12" fill="rgba(0,240,255,0.08)" stroke="rgba(0,240,255,0.25)" stroke-width="1"/>
  <text x="535" y="358" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="10">Avg Latency</text>
  <text x="535" y="374" fill="#00F0FF" font-family="sans-serif" font-size="13" font-weight="700">4.2 ms</text>
</svg>
