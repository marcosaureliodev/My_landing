<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcos Aurélio | Fullstack & Software Engineer</title>
  <link rel="icon" href="assets/fivicon.svg" type="image/x-icon">
  <meta name="description"
    content="Portfólio profissional de Marco, Fullstack & Software Engineer especializado em arquitetura web moderna, sistemas distribuídos, microsserviços e interfaces fluidas de alto padrão.">
  <meta name="theme-color" content="#08090d">

  <!-- Google Fonts: Inter para tipografia refinada no estilo Apple -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Folhas de Estilo -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Efeito de Brilho Ambiente do Cursor -->
  <div id="ambientGlow" class="ambient-glow" aria-hidden="true"></div>

  <!-- Componente Header (Dynamic Island Apple iOS 18) -->
  <div data-component="components/header.html"></div>

  <!-- Conteúdo Principal Modularizado -->
  <main>
    <!-- Seção Hero -->
    <div data-component="components/hero.html"></div>

    <!-- Seção Bento Widgets -->
    <div data-component="components/bento.html"></div>

    <!-- Seção Terminal macOS -->
    <div data-component="components/terminal.html"></div>

    <!-- Seção Vitrine de Projetos -->
    <div data-component="components/projects.html"></div>

    <!-- Seção Centro de Controle & Contato -->
    <div data-component="components/contact.html"></div>
  </main>

  <!-- Componente Rodapé -->
  <div data-component="components/footer.html"></div>

  <!-- Botão Flutuante Voltar ao Topo -->
  <button id="backToTopBtn" class="back-to-top-btn" aria-label="Voltar ao topo da página">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/dynamic-island.js"></script>
  <script src="js/interactive.js"></script>
</body>

</html>
