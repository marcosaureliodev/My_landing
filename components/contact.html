      <!-- Direita: Formulário de Contato em Vidro -->
      <form id="contactForm" class="contact-form-glass glass-surface">
        <div class="form-group">
          <label for="formName" class="form-label">Seu Nome</label>
          <input type="text" id="formName" class="form-input" placeholder="Ex: Ana Silva" required
            aria-required="true">
        </div>

        <div class="form-group">
          <label for="formEmail" class="form-label">Seu E-mail Corporativo</label>
          <input type="email" id="formEmail" class="form-input" placeholder="Ex: ana@empresa.com" required
            aria-required="true">
        </div>

        <div class="form-group">
          <label for="formMessage" class="form-label">Detalhes da Oportunidade ou Projeto</label>
          <textarea id="formMessage" class="form-textarea"
            placeholder="Conte brevemente sobre o escopo, tecnologia e objetivos..." required
            aria-required="true"></textarea>
        </div>

        <button type="submit" class="btn-apple-primary">
          <span>Enviar Mensagem</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
